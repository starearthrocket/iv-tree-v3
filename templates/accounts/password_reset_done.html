{% extends 'base.html' %}

{% block title %}Reset Email Sent | I-V Tree{% endblock %}

{% block content %}
<main>
    <section class="delete-section">
        <div class="section-container">
            <div class="delete-card">
                <p class="section-eyebrow">Check your email</p>

                <h1>Reset link sent</h1>

                <p>
                    If an account exists for that email address, we've sent
                    instructions for resetting the password.
                </p>

                <a
                    href="{% url 'accounts:login' %}"
                    class="button button-outline-dark"
                >
                    Back to Login
                </a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
